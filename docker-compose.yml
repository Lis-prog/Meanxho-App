services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: menaxho
      POSTGRES_PASSWORD: menaxho
      POSTGRES_DB: menaxho
    ports:
      - "5433:5432"
    volumes:
      - menaxho_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menaxho -d menaxho"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  menaxho_pg:
